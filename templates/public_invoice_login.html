<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niyaz Invoice</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="public-invoice-page">
    <h1>Niyaz Invoice</h1>
    <p>Enter the password you were given to view this invoice.</p>
    {% if error %}<p class="none">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('public_invoice_login', token=token) }}" class="miqaat-form">
      <label>
        Password
        <input type="password" name="password" required autofocus>
      </label>
      <button type="submit">View Invoice</button>
    </form>
  </main>
</body>
</html>
