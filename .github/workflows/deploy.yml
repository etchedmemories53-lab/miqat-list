name: Build and deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  SERVICE_NAME: miqat-list
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation — no stored key needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "${IMAGE}"

      # --allow-unauthenticated: Cloud Run's own IAM layer only understands
      # Google IAM principals, not arbitrary Google accounts with an email
      # allowlist, so it stays open at that layer - the app enforces its own
      # Google sign-in (see auth.py) on every route instead.
      # --service-account: without this, Cloud Run runs the container under
      # the project's default Compute Engine service account. A dedicated
      # runtime identity (created by gcp/setup.sh) keeps it isolated from
      # other apps regardless.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          env_vars: |
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
            ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}
